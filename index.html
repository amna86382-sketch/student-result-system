
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Result System</h1>
        <p class="subtitle">Enter student details and calculate result</p>
        <form id="resultForm">
            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name" required >
            </div>
            <div class="form-group">
                <label for="english">English (100)</label>
                <input
                    type="number"
                    id="english"
                    placeholder="Enter English marks"
                    min="0"
                    max="100"required>
            </div>
            <div class="form-group">
                <label for="math">Math (100)</label>
                <input
                  type="number"
                    id="math"
                    placeholder="Enter Math marks"
                    min="0"
                    max="100"
                    required>
            </div>
            <div class="form-group">
                <label for="computer">Computer (100)</label>
                <input
                    type="number"
                    id="computer"
                    placeholder="Enter Computer marks"
                    min="0"
                    max="100"
                    required>
            </div>
            <div class="form-group">
                <label for="science">Science (100)</label>
                <input
                    type="number"
                    id="science"
                    placeholder="Enter Science marks"
                    min="0"
                    max="100"
                    required>
            </div>
            <div class="form-group">
                <label for="urdu">Urdu (100)</label>
                <input
                    type="number"
                    id="urdu"
                    placeholder="Enter Urdu marks"
                    min="0"
                    max="100"
                    required
                >
            </div>
            <button type="submit">Calculate Result</button>
        </form>
        <p id="message" role="status"></p>
        <section class="results-section">
            <h2>Saved Student Results</h2>
            <div id="resultList"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
